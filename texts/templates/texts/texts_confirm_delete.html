{% extends "texts/base.html" %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="mb-4">Удалить сообщение</h1>
        <p>Вы уверены, что хотите удалить сообщение <strong>{{ text.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'texts:texts_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
