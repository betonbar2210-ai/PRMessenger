{% extends 'texts/base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>Восстановление пароля</h1>
        <p class="text-muted">Укажите email — отправим на него ссылку для сброса пароля.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Отправить ссылку</button>
        </form>
    </div>
</div>
{% endblock %}
