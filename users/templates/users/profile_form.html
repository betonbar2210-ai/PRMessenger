{% extends "texts/base.html" %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="container py-4">
    <h1>Редактирование профиля</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            Сохранить
        </button>
    </form>
</div>
{% endblock %}
