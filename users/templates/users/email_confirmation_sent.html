{% extends 'texts/base.html' %}
{% block title %}Проверьте почту{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1>Проверьте почту</h1>
        <p class="text-muted">
            Мы отправили письмо со ссылкой для подтверждения email. Перейдите по ней,
            чтобы активировать аккаунт. Ссылка действует 24 часа.
        </p>

        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <input type="email" name="email" id="id_email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Отправить письмо повторно</button>
        </form>
    </div>
</div>
{% endblock %}
