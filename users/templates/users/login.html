{% extends 'texts/base.html' %}
{% load static %}
{% block title %}Авторизация{% endblock title %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Авторизация</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">
                        Войти
                    </button>
                </form>

                <div class="mt-3 d-flex flex-column gap-2">
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
                    <a href="{% url 'users:resend_confirmation' %}">
                        Не пришло письмо для подтверждения?
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
