{% extends "texts/base.html" %}

{% block title %}Удалить рассылку{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="mb-4">Удалить рассылку</h1>
        <p>Вы уверены, что хотите удалить рассылку <strong>#{{ bulkmailing.pk }}</strong> ({{ bulkmailing.message.title }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'bulkmailing:bulkmailing_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
